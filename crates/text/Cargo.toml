[package]
name = "tracedraw-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Font discovery, shaping and glyph outlines for CD Draw"

[dependencies]
tracedraw-core.workspace = true
kurbo.workspace = true
# System font discovery (font files on disk, fontconfig).
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
ttf-parser.workspace = true
rustybuzz.workspace = true
unicode-bidi = "0.3"
encoding_rs.workspace = true
unicode-general-category.workspace = true
log.workspace = true

# The folders fontconfig lists, for the font list's filter (#867): read
# with the same crate the font database reads them with.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
fontconfig-parser = { version = "0.5", default-features = false }

# The fonts Windows lists as installed, from its registry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
