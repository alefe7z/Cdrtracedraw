name: Reference UI validation

on:
  push:
    branches: [claude/rebrand-cd-draw]
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'Cargo.*'
      - '.github/workflows/reference-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Native and visual dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev xvfb openbox x11-utils libgl1-mesa-dri libxkbcommon-x11-0 python3-xlib imagemagick
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format and capture formatting patch
        run: |
          cargo fmt --all
          git diff --binary > reference-format.patch
      - name: Workspace tests
        timeout-minutes: 12
        run: cargo test --workspace -- --test-threads=1 --nocapture
      - name: Library lint gate
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --exclude tracedraw -- -D warnings
      - name: Native build
        if: ${{ !cancelled() }}
        run: cargo build -p tracedraw
      - name: Render the real catalog UI
        if: ${{ !cancelled() }}
        env:
          REFERENCE_SHOTS: ${{ github.workspace }}/reference-shots
        run: cargo test -p tracedraw reference_catalog_shot -- --ignored --test-threads=1
      - name: Native smoke and interaction checks
        if: ${{ !cancelled() }}
        env:
          TRACEDRAW_SHOTS: ${{ github.workspace }}/native-shots
          MONKEY_SEED: '23'
          MONKEY_STEPS: '100'
        run: |
          scripts/visual/run.sh scripts/visual/smoke_edit.py
          scripts/visual/run.sh scripts/visual/monkey.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-validation
          path: |
            reference-format.patch
            reference-shots/
            native-shots/
